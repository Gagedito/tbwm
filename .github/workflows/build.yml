name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config meson ninja-build git ca-certificates \
            libwayland-dev libwayland-bin wayland-protocols \
            libxkbcommon-dev xkb-data libinput-dev libpixman-1-dev \
            libfreetype-dev libxcb1-dev libxcb-icccm4-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libseat-dev libffi-dev libxml2-dev hwdata \
            libdisplay-info-dev libliftoff-dev

      - name: Build Wayland >= 1.23.1 from source (Ubuntu ships 1.22.0)
        run: |
          git clone --depth 1 --branch 1.23.1 \
            https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          cd /tmp/wayland
          meson setup build --prefix=/usr -Ddocumentation=false
          ninja -C build
          sudo ninja -C build install

      - name: Build wlroots 0.19 (not packaged on Ubuntu)
        run: |
          git clone --depth 1 --branch 0.19.0 \
            https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          cd /tmp/wlroots
          meson setup build --prefix=/usr/local -Dexamples=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          pkg-config --exists wlroots-0.19 && echo "wlroots-0.19 OK"

      - name: Build tbwm
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          TBWM_XKB_LAYOUT=latam make -j2
          test -x tbwm && echo "tbwm built OK"